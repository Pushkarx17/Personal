<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Pushkar Kodigehalli Umesh</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div class="page page-narrow">

    <header class="fade-item" style="animation-delay:.05s">
      <h1 class="name">4<span class="dim">04</span></h1>
    </header>

    <main>
    <section class="terminal fade-item" style="animation-delay:.15s" aria-label="Page not found">
      <div class="term-line"><span class="prompt">$</span> cd <span id="missing-path">/this-page</span></div>
      <div class="term-out">cd: no such file or directory</div>
      <div class="term-line"><span class="prompt">$</span> cd ~</div>
      <div class="term-out"><a href="/" class="arrow-link"><span class="underline-text">back home</span></a></div>
      <div class="term-line"><span class="prompt">$</span> <span class="cursor"></span></div>
    </section>
    </main>

    <footer class="page-footer fade-item" style="animation-delay:.3s">
      &copy; 2026 Pushkar Kodigehalli Umesh.
      <ul class="footer-links">
        <li><a href="/privacy.html">privacy</a></li>
        <li><a href="/cookies.html">cookies</a></li>
        <li><a href="/terms.html">terms</a></li>
      </ul>
    </footer>
  </div>

  <script>
    var el = document.getElementById("missing-path");
    if (el && location.pathname && location.pathname !== "/") {
      var p = location.pathname;
      try { p = decodeURIComponent(p); } catch (e) { /* malformed %-escape, show raw */ }
      el.textContent = p.length > 60 ? p.slice(0, 57) + "\u2026" : p;
    }
  </script>
</body>
</html>
